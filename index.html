<title>Multi-Asset Research</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1f3a'/%3E%3Cpath d='M7 22l6-7 5 4 7-9' stroke='%2346c2a8' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#f4f6fa;--surface:#fff;--ink:#0d1b2e;--ink2:#46536a;--muted:#7a8599;--line:#e2e7ef;--navy:#0b1f3a;--navy2:#13335e;--acc:#1d5fbf;--teal:#1f9e86;--ow:#1f9e86;--uw:#c4473a;--n:#8a94a6;--shadow:0 1px 2px rgba(13,27,46,.06),0 8px 24px rgba(13,27,46,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0a111c;--surface:#121b29;--ink:#e9eef6;--ink2:#b5c0d2;--muted:#7f8ba0;--line:#223047;--acc:#6ea8ff;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:28px 16px 84px;position:relative;overflow:hidden}
.hero svg.bg{position:absolute;right:-40px;bottom:-10px;width:520px;max-width:90%;opacity:.18}
.bar{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:.01em;font-size:16px}
.mark{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.1);display:grid;place-items:center}
.hero h1{max-width:1040px;margin:34px auto 6px;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.01em;position:relative}
.hero p{max-width:1040px;margin:0 auto;color:#b9c8de;position:relative}
.wrap{max-width:1040px;margin:-56px auto 0;padding:0 16px 56px;position:relative}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.lock{max-width:420px;margin:0 auto;padding:28px}
.lock h2{margin:0 0 4px;font-size:19px}.lock .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.lock .ic{width:44px;height:44px;border-radius:12px;background:rgba(29,95,191,.1);color:var(--acc);display:grid;place-items:center;margin-bottom:14px}
.field{position:relative}.field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--bg);color:var(--ink);outline:none}
.field input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(29,95,191,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:600;font-size:15px;padding:12px 16px;cursor:pointer;text-decoration:none}
.lock .btn{width:100%;margin-top:12px}.err{color:var(--uw);min-height:20px;margin-top:10px;font-size:13px}
.ghost{background:rgba(255,255,255,.12);color:#fff;padding:7px 12px;font-size:13px;font-weight:500}
.feat{padding:22px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);font-weight:700}
.feat h2{margin:6px 0 4px;font-size:22px;letter-spacing:-.01em}.feat .date{color:var(--muted);font-size:14px}
.feat .headline{font-size:16.5px;line-height:1.5;color:var(--ink2);margin:14px 0 18px;max-width:860px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions a{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;background:var(--bg)}
.actions a.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.actions a:hover{border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px}.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:20px;font-weight:700;margin-top:2px}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;margin-top:12px}
.panel{padding:18px}.panel h3{margin:0 0 12px;font-size:14px;letter-spacing:.02em}
.idea{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.idea:first-of-type{border-top:0}
.rk{flex:0 0 22px;height:22px;border-radius:6px;background:rgba(29,95,191,.1);color:var(--acc);font-weight:700;font-size:12px;display:grid;place-items:center}
.idea .t{flex:1}.idea .ru{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.st{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}.st:first-of-type{border-top:0}
.pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.04em}
.OW{background:rgba(31,158,134,.14);color:var(--ow)}.UW{background:rgba(196,71,58,.13);color:var(--uw)}.N{background:rgba(138,148,166,.16);color:var(--n)}
.archive{margin-top:12px;padding:18px}.archive .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.archive h3{margin:0;font-size:14px}.archive input{padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:14px;width:220px;max-width:50%}
.row{display:grid;grid-template-columns:150px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row .d{font-weight:650;font-size:14px}.row .d small{display:block;color:var(--muted);font-weight:400}
.row .h{color:var(--ink2);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.icons{display:flex;gap:6px}.icons a{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2);background:var(--bg)}
.icons a:hover{color:var(--acc);border-color:var(--acc)}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin-top:26px;line-height:1.6}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.row{grid-template-columns:1fr auto}.row .h{grid-column:1/-1;grid-row:2}.hero h1{font-size:24px}}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const IC = {
  dashboard: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  pdf: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 14h8M8 17h5"/></svg>',
  email: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>'};
const LBL = {dashboard: "Interactive dashboard", pdf: "PDF report", email: "Email version"};
function render(items) {
  const e = items[0], app = document.getElementById("app");
  document.getElementById("title").textContent = "Multi-Asset Research Daily";
  document.getElementById("tag").textContent = `${items.length} editions in the archive · latest ${e.date_long}`;
  const acts = e.files.map((f, i) => `<a class="${i ? "" : "primary"}" href="${esc(f.path)}">${IC[f.kind]}${LBL[f.kind]}</a>`).join("");
  const k = e.stats || {};
  app.innerHTML = `
  <section class="card feat"><div class="eyebrow">Latest edition</div><h2>${esc(e.date_long)}</h2>
    <div class="headline">${esc(e.headline)}</div><div class="actions">${acts}</div>
    <div class="grid">
      <div class="kpi"><div class="l">Trade ideas</div><div class="v">${esc(k.ideas)}</div></div>
      <div class="kpi"><div class="l">Risk budget used</div><div class="v">${esc(k.ru)} RU</div></div>
      <div class="kpi"><div class="l">Stock ideas</div><div class="v">${esc(k.stocks)}</div></div>
      <div class="kpi"><div class="l">ETF ideas</div><div class="v">${esc(k.etfs)}</div></div></div></section>
  <div class="two">
    <section class="card panel"><h3>Top ideas</h3>${(e.ideas || []).map(i => `<div class="idea"><span class="rk">${i.rank}</span><span class="t">${esc(i.title)}</span><span class="ru">${i.ru} RU</span></div>`).join("")}</section>
    <section class="card panel"><h3>Directional stances</h3>${(e.stances || []).map(s => `<div class="st"><span>${esc(s.market)}</span><span class="pill ${esc(s.stance)}">${esc(s.stance)}</span></div>`).join("")}</section>
  </div>
  <section class="card archive"><div class="top"><h3>Archive</h3><input id="q" type="search" placeholder="Search editions"></div><div id="rows"></div></section>`;
  const rows = document.getElementById("rows");
  const draw = q => { rows.innerHTML = items.filter(x => !q || (x.date_long + " " + x.headline).toLowerCase().includes(q)).map(x => `
    <div class="row"><div class="d">${esc(x.date)}<small>${esc(x.date_long.split(" ")[0])}</small></div><div class="h">${esc(x.headline)}</div>
    <div class="icons">${x.files.map(f => `<a href="${esc(f.path)}" title="${LBL[f.kind]}" aria-label="${LBL[f.kind]}">${IC[f.kind]}</a>`).join("")}</div></div>`).join("") || '<div class="row"><div class="h">No editions match.</div></div>'; };
  draw(""); document.getElementById("q").oninput = ev => draw(ev.target.value.trim().toLowerCase());
}
async function show(raw) {
  const items = JSON.parse(new TextDecoder().decode(await decrypt(raw, MANIFEST)));
  const next = new URLSearchParams(location.search).get("next");
  if (next && items.some(e => e.files.some(f => f.path === next))) { location.replace(next); return; }
  document.getElementById("lock").hidden = true; document.getElementById("app").hidden = false;
  const out = document.getElementById("out"); out.hidden = false; out.onclick = () => { forget(); location.replace(location.pathname); };
  render(items);
}
document.getElementById("f").onsubmit = async ev => {
  ev.preventDefault(); const err = document.getElementById("err"); err.textContent = "Unlocking…";
  let raw;
  try { raw = await derive(document.getElementById("pw").value); await decrypt(raw, MANIFEST); }
  catch (e) { err.textContent = "That password is not right. Please try again."; return; }
  storeKey(raw); err.textContent = ""; show(raw);
};
const k0 = storedKey(); if (k0) show(k0).catch(() => forget());
