<script>

const SALT = "tvj/QKzB6NM2xXvBZYUxmA==", ITER = 310000;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function keyFrom(raw) { return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]); }
async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: b64(SALT), iterations: ITER}, base, 256);
  return new Uint8Array(bits);
}
async function decrypt(raw, payload) {
  const buf = typeof payload === "string" ? b64(payload) : new Uint8Array(payload);
  return new Uint8Array(await crypto.subtle.decrypt({name: "AES-GCM", iv: buf.slice(0, 12)}, await keyFrom(raw), buf.slice(12)));
}
function storedKey() { try { const k = localStorage.getItem("mpr_key_" + SALT); return k ? b64(k) : null; } catch (e) { return null; } }
function storeKey(raw) { try { localStorage.setItem("mpr_key_" + SALT, btoa(String.fromCharCode(...raw))); } catch (e) {} }
function forget() { try { localStorage.removeItem("mpr_key_" + SALT); } catch (e) {} }

const KIND = "email", NAME = "email.html", HOME = "../", BIN = "2026-10-07-email.bin", GZ = true;
(async () => {
  const raw = storedKey();
  if (!raw) { location.replace(HOME + "?next=" + encodeURIComponent(location.pathname.split("/").slice(-2).join("/"))); return; }
  let bytes;
  try {
    const res = await fetch(BIN, {cache: "no-cache"});
    bytes = await decrypt(raw, await res.arrayBuffer());
  } catch (e) { forget(); location.replace(HOME); return; }
  if (GZ) bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
  const msg = document.getElementById("msg");
  if (KIND === "pdf") {
    const url = URL.createObjectURL(new Blob([bytes], {type: "application/pdf"}));
    msg.innerHTML = `The PDF report is ready.<br><a href="${url}" download="${NAME}"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>Download ${NAME}</a>`;
    if (!/iPhone|iPad|Android/i.test(navigator.userAgent)) {
      const f = document.createElement("iframe"); f.className = "frame"; f.src = url; f.title = NAME; document.body.appendChild(f);
    }
  } else {
    const theme = document.documentElement.dataset.theme || "light";
    const html = new TextDecoder().decode(bytes).replace(/<html(?![^>]*data-theme)/i, `<html data-theme="${theme}"`), f = document.createElement("iframe");
    f.className = "frame"; f.srcdoc = html; f.title = document.title;
    msg.remove(); document.body.appendChild(f);
  }
})();
